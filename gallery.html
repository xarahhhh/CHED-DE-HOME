<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery - Chef De Home</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    background: #f5f5f5;
}

/* HEADER */
header {
    background-color: #333;
    padding: 10px 0;
    position: sticky;
    top: 0;
    z-index: 1000;
}

.container {
    width: 90%;
    margin: auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
}

/* LOGO */
.logo {
    display: flex;
    align-items: center;
    gap: 10px;
}

.logo img {
    width: 45px;
    height: 45px;
    border-radius: 50%;
}

.logo span {
    color: white;
    font-size: 28px;
    font-weight: bold;
}

/* NAV */
.nav-links {
    list-style: none;
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.nav-links a {
font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
    text-decoration: none;
    color: white;
    font-size: 18px;
    padding: 6px 10px;
}

.nav-links a:hover {
    background-color: #555;
    border-radius: 5px;
}

/* DROPDOWN */
.dropdown {
    position: relative;
}

.dropdown-menu {
    display: none;
    position: absolute;
    background-color: #333;
    list-style: none;
    padding: 0;
    margin: 0;
    top: 100%;
    left: 0;
    min-width: 150px;
    border-radius: 5px;
    z-index: 1000;
}

.dropdown-menu li a {
    display: block;
    padding: 10px;
    color: white;
}

.dropdown-menu li a:hover {
    background-color: #555;
}

.dropdown:hover .dropdown-menu {
    display: block;
}

/* TITLE */
.title {
    text-align: center;
    padding: 40px 20px 20px;
}

.title h1 {
    font-size: 50px;
    color: #333;
}

/* GALLERY */
.gallery {
    width: 90%;
    margin: auto;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 15px;
    padding-bottom: 40px;
}

.gallery img {
    width: 100%;
    height: 200px;
    object-fit: cover;
    border-radius: 10px;
    cursor: pointer;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

/* MODAL */
.modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.7);
    justify-content: center;
    align-items: center;
}

.modal-content {
    background: white;
    padding: 20px;
    width: 380px;
    border-radius: 10px;
    white-space: pre-line;
}

.close {
    float: right;
    cursor: pointer;
    font-size: 22px;
}

footer {
    padding: 20px 0;
    background: #333;
    text-align: center;
    color: #fff;
}

@media (max-width: 600px) {
    .title h1 {
        font-size: 32px;
    }

    .container {
        flex-direction: column;
        gap: 10px;
    }

    .dropdown-menu {
        position: static;
    }
}
</style>
</head>

<body>
